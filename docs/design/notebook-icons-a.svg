<symbol id="highlighter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(40 12 12)"><path d="M10 2h4a2 2 0 0 1 2 2v11l-2 3h-4l-2-3V4a2 2 0 0 1 2-2ZM8 15h8M10 18v4h4v-4" /></g></symbol>
<symbol id="eraser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(45 12 12)"><rect x="7" y="3" width="10" height="18" rx="2.2" /><path d="M7 14h10" /></g></symbol>
<symbol id="lasso" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="11" rx="9.5" ry="5.8" transform="rotate(-25 12 11)" stroke-dasharray="2.5 2.6" /><path d="m16.3 17.4 1.5 2.5" /></symbol>
<symbol id="hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V5.5a1.5 1.5 0 0 1 3 0V10 3.5a1.5 1.5 0 0 1 3 0V10 5a1.5 1.5 0 0 1 3 0v6-3.5a1.5 1.5 0 0 1 3 0V14c0 5-2.4 8-6.8 8-3 0-4.7-1.6-6.2-4L3 13.5a1.6 1.6 0 0 1 2.4-2Z" /></symbol>
<symbol id="undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 5-4.5 4.5L7.5 14" /><path d="M3 9.5h10.5c7 0 9 7.2 4 10.5" /></symbol>
<symbol id="redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m16.5 5 4.5 4.5-4.5 4.5" /><path d="M21 9.5H10.5c-7 0-9 7.2-4 10.5" /></symbol>
</defs>
