<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352">
<title>Solasi A outline icons at 20 and 24 CSS pixels</title>
<desc>Exact application paths with a 1.65-unit round stroke. White and charcoal panels show both icon sizes without scaling the review sheet.</desc>
<defs>
